[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainsync"
version = "0.1.0"
description = "Karakeep / Cairn / Zotero / Obsidian を束ねて Obsidian へ自動一覧と週次レビューを出力する統合層"
requires-python = ">=3.11"
# 依存は標準ライブラリのみを維持する（INTEGRATION.md T2）
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
brainsync = "brainsync.cli:main"

[tool.setuptools.packages.find]
include = ["brainsync*"]
