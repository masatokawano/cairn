# backlog A6: starlette 1.3 の TestClient は httpx2 未導入時に
# StarletteDeprecationWarning (UserWarning 派生) を出す。テスト出力の問題に
# ランタイム依存 (httpx2) を足さず、message 一致で抑制する — starlette が
# 文言を変えたら warning は再表示される (隠れない)。httpx2 への移行は
# 次の意図的な starlette 更新時に再検討。
[pytest]
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
