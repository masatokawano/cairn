# Verbatim lab-sheet spellings -> canonical metric_id (namespace lab_sheet).
# Includes full names AND abbreviations; the importer tries the full name
# then the 項目略称 column. Unknown spellings are QUARANTINED, never guessed —
# extend this file (and bump mapping_version) instead. Some entries preserve
# the source sheet's exact spelling, including its typos (e.g. 総ピリルビン).
mapping_version: "2026.07-2"

aliases:
  # liver / protein
  AST: ast
  AST(GOT): ast
  GOT: ast
  ALT: alt
  ALT(GPT): alt
  GPT: alt
  ALP: alp
  LD: ld
  LDH: ld
  γ-GTP: gamma_gtp
  γGTP: gamma_gtp
  GGT: gamma_gtp
  コリンエステラーゼ: cholinesterase
  Ch-E: cholinesterase
  ChE: cholinesterase
  血清アミラーゼ: amylase
  SAMY: amylase
  AMY: amylase
  CPK: ck
  CK: ck
  ZTT: ztt
  総蛋白: total_protein
  TP: total_protein
  アルブミン: albumin
  Alb: albumin
  アルブミン対グロブリン比: ag_ratio
  A/G: ag_ratio
  総ビリルビン: total_bilirubin
  総ピリルビン: total_bilirubin
  TBL: total_bilirubin
  T-BIL: total_bilirubin

  # renal / electrolytes
  尿素窒素: urea_nitrogen
  UN: urea_nitrogen
  BUN: urea_nitrogen
  クレアチニン: creatinine
  Cr: creatinine
  CRE: creatinine
  クレアチン: creatine
  Creatine: creatine
