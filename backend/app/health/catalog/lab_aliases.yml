  グリコアルブミン: glycoalbumin
  GA: glycoalbumin
  HbA1c: hba1c
  ヘモグロビンAlc: hba1c
  総コレステロール: total_cholesterol
  T-Cho: total_cholesterol
  T-CHO: total_cholesterol
  LDLコレステロール: ldl_cholesterol
  LDL-C: ldl_cholesterol
  HDLコレステロール: hdl_cholesterol
  HDL-C: hdl_cholesterol
