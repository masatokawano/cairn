  ヘモグロビン量: hemoglobin
  血色素量: hemoglobin
  Hb: hemoglobin
  Hgb: hemoglobin
  赤血球: rbc
  RBC: rbc
  白血球数: wbc
  WBC: wbc
  血小板数: platelets
  PLT: platelets
  ヘマトクリット値: hematocrit
  Ht: hematocrit
  Hct: hematocrit
  平均赤血球容積: mcv
  MCV: mcv
